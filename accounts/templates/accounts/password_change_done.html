{% extends "core/base.html" %}
{% load static %}

{% block title %}Contraseña actualizada — ComuniApp{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/profile.css' %}">
{% endblock %}

{% block content %}
<section class="profile-page profile-page--narrow" data-profile-page="password-change-done">
  <div class="container">
    <div class="profile-success card">
      <div class="profile-success__icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64" fill="none">
          <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="3"/>
          <path d="M20 33l8 8 16-18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="h1 profile-success__title">Contraseña actualizada</h1>
      <p class="profile-success__text text-secondary">
        Tu contraseña ha sido cambiada correctamente.
      </p>
      <div class="profile-success__actions">
        <a href="{% url 'accounts:profile' %}" class="btn btn--primary">Volver a mi cuenta</a>
        <a href="{% url 'catalog:index' %}" class="btn btn--outline">Ir al catálogo</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
